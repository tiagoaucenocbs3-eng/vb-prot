<body>
  <main class="verify-page">
    <section class="verify-wrap" aria-label="Security verification">
      <div class="verify-title">
        <span class="title-icon" aria-hidden="true"><span class="title-check">✓</span></span>
        <span id="titleText">Security Verification</span>
      </div>

      <button id="verifyBox" class="captcha-box" type="button" aria-label="Confirm verification">
        <span id="checkbox" class="captcha-checkbox" aria-hidden="true"></span>
        <span id="checkboxText" class="captcha-label">I am not a robot</span>
        <span class="captcha-brand" aria-hidden="true">
          <span class="google-g">G</span>
          <span class="recaptcha-name">reCAPTCHA</span>
          <span id="recaptchaLinks" class="recaptcha-links"><span>Privacy</span><span>Terms</span></span>
        </span>
      </button>

      <div id="footerText" class="verify-footer">Protected by verification · Privacy · Terms</div>
    </section>
  </main>

  <script>
    const cfg = window.PRESELL_CONFIG || {};
    const title = cfg.title || 'Security Verification';
    const checkboxText = cfg.checkboxText || 'I am not a robot';
    const footerText = cfg.footerText || 'Protected by verification · Privacy · Terms';
    document.title = title;
    document.getElementById('titleText').textContent = title;
    document.getElementById('checkboxText').textContent = checkboxText;
    document.getElementById('footerText').textContent = footerText;

    const box = document.getElementById('verifyBox');
    const check = document.getElementById('checkbox');
    let clicked = false;

    function getDestinationUrl() {
      const params = new URLSearchParams(window.location.search);
      let url = params.get('to') || params.get('redirect') || params.get('url') || cfg.destinationUrl || '#';
      if (url && url !== '#' && window.location.search) {
        const searchParams = new URLSearchParams(window.location.search);
        if (url.includes('?')) {
          const parts = url.split('?');
          const urlParams = new URLSearchParams(parts[1]);
          searchParams.forEach((value, key) => {
            if (!urlParams.has(key)) {
              urlParams.set(key, value);
            }
          });
          url = parts[0] + '?' + urlParams.toString();
        } else {
          url = url + '?' + searchParams.toString();
        }
      }
      return url;
    }

    function isValidDestination(url) {
      return url && url !== '#' && !url.includes('SEU-LINK-AQUI') && !url.includes('COLE-O-LINK-AQUI');
    }

    box.addEventListener('click', () => {
      if (clicked) return;
      clicked = true;
      box.classList.add('loading');
      check.innerHTML = '<span class="spinner"></span>';

      setTimeout(() => {
        box.classList.remove('loading');
        box.classList.add('checked');
        check.textContent = '✓';
        const url = getDestinationUrl();
        if (cfg.redirectAfterVerify !== false && isValidDestination(url)) {
          window.location.href = url;
        }
      }, Number(cfg.delayAfterClick || 650));
    }, { passive: true });
  </script>
